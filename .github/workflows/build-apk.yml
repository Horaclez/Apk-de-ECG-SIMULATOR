name: Compilar APK Offline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar estructura e instalar Capacitor
        run: |
          if [ ! -f www/index.html ] && [ -f index.html ]; then mkdir -p www && cp index.html www/; fi
          if [ -f icon.png ]; then mkdir -p assets && cp icon.png assets/icon.png; fi
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
          npx cap add android
          npx --yes @capacitor/assets generate --android || true
          npx cap sync

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        with:
          name: ECG-ACLS-Master-Lab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
